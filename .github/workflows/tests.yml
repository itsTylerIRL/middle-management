name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Installing the audio extra is part of the test: it must resolve quickly on every platform.
      - name: Install
        run: python -m pip install -e ".[audio,dev]"
        timeout-minutes: 10
      - name: Test
        # The annotate plugin turns failures into annotations, readable without access to the logs.
        run: |
          python -m pip install pytest-github-actions-annotate-failures
          python -m pytest -q
