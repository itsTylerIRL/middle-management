[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "middlemanagementd"
version = "0.1.0"
description = "Corporate Alignment Enforcement Daemon: demands verbal status reports and grades your synergy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "PyYAML>=6.0",
    "rich>=13.0",
    "textual>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Only the machine with the microphone/speakers needs these.
audio = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
middlemanagementd = "middlemanagementd.cli:main"

[tool.setuptools.packages.find]
include = ["middlemanagementd*"]

[tool.setuptools.package-data]
middlemanagementd = ["data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
